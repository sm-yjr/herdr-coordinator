name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tower
      - name: Format
        run: cargo fmt --manifest-path tower/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --manifest-path tower/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path tower/Cargo.toml --all-targets
      - name: Release build
        run: cargo build --manifest-path tower/Cargo.toml --release --locked
      - name: Launcher syntax
        run: bash -n fleet dashboard.sh scripts/fetch-or-build.sh
      - name: No Python runtime
        run: test -z "$(find . -path './tower/target' -prune -o -name '*.py' -print)"
