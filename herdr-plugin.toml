id = "sm-yjr.herdr-coordinator"
name = "Herdr Coordinator"
version = "0.3.0"
min_herdr_version = "0.8.0"
description = "Human-in-the-loop supervisory control plane for long-running coding-agent fleets."
platforms = ["linux", "macos"]

[[build]]
command = ["bash", "scripts/fetch-or-build.sh"]

[[startup]]
command = ["./bin/herdr-coordinator", "plugin-reconcile"]

[[actions]]
id = "open"
title = "Open Fleet Control Tower"
description = "Open, focus, or close the Herdr Coordinator overlay."
contexts = ["workspace", "pane"]
command = ["./bin/herdr-coordinator", "open"]

[[actions]]
id = "reconcile"
title = "Reconcile Fleet Runtime"
description = "Refresh the coordinator runtime projection from a Herdr snapshot."
contexts = ["workspace", "pane"]
command = ["./bin/herdr-coordinator", "plugin-reconcile"]

[[panes]]
id = "tower"
title = "Fleet Control Tower"
placement = "overlay"
command = ["./bin/herdr-coordinator", "tower"]

[[events]]
on = "workspace.created"
command = ["./bin/herdr-coordinator", "plugin-event"]

[[events]]
on = "workspace.closed"
command = ["./bin/herdr-coordinator", "plugin-event"]

[[events]]
on = "tab.created"
command = ["./bin/herdr-coordinator", "plugin-event"]

[[events]]
on = "tab.closed"
command = ["./bin/herdr-coordinator", "plugin-event"]

[[events]]
on = "pane.created"
command = ["./bin/herdr-coordinator", "plugin-event"]

[[events]]
on = "pane.closed"
command = ["./bin/herdr-coordinator", "plugin-event"]

[[events]]
on = "pane.moved"
command = ["./bin/herdr-coordinator", "plugin-event"]

[[events]]
on = "pane.exited"
command = ["./bin/herdr-coordinator", "plugin-event"]

[[events]]
on = "pane.agent_detected"
command = ["./bin/herdr-coordinator", "plugin-event"]

[[events]]
on = "pane.agent_status_changed"
command = ["./bin/herdr-coordinator", "plugin-event"]
